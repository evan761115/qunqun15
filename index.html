<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>群群15號</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：上方固定一條連線列（後端網址），下方左稿右成品的編輯台雙欄，手機疊成單欄 */
:root{
  --bg:#EEF1F0; --panel:#FFFFFF; --ink:#16211F; --muted:#5C6B68; --line:#CFD8D5;
  --accent:#0B6E63; --accent-ink:#FFFFFF; --soft:#DCEBE8; --warn:#A8321F; --warn-bg:#FBE9E5;
  --display:"Noto Serif TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111917; --panel:#1A2422; --ink:#E6EEEC; --muted:#93A5A1; --line:#31403D;
    --accent:#4FC2B2; --accent-ink:#06211D; --soft:#22332F; --warn:#FF9C89; --warn-bg:#3A1F1A;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
header{padding-block:28px 18px}
.mast{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:900;font-size:clamp(1.9rem,5vw,2.6rem);margin:0;letter-spacing:.04em;line-height:1.2}
.tagline{color:var(--muted);font-size:.95rem;margin:0}
.conn{margin-top:18px;background:var(--panel);border:2px solid var(--accent);border-radius:6px;padding:14px 16px;display:grid;gap:8px}
.conn label{font-weight:700;font-size:.95rem}
.conn .row{display:flex;gap:10px;flex-wrap:wrap}
.conn input{flex:1 1 260px;min-width:0;font-family:var(--mono);font-size:.95rem}
.hint{color:var(--muted);font-size:.85rem;margin:0}
input,textarea,button{font:inherit;color:inherit}
input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:280px;line-height:1.75}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-block:22px 14px}
.tab{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:500}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.desk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding-bottom:48px}
@media (max-width:820px){.desk{grid-template-columns:minmax(0,1fr)}}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pane h2{font-family:var(--display);font-size:1.25rem;margin:0;line-height:1.3}
.what{margin:0;color:var(--muted);font-size:.92rem}
.field{display:grid;gap:4px}
.field label{font-size:.9rem;font-weight:700}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.count{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:11px 22px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.55;cursor:progress}
.ghost{background:transparent;border:1px solid var(--line);border-radius:4px;padding:8px 14px;cursor:pointer}
.status{font-size:.9rem;color:var(--muted);margin:0;min-height:1.6em}
.status.err{color:var(--warn);background:var(--warn-bg);padding:8px 12px;border-radius:4px}
#out{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:16px;min-height:280px;margin:0;font-family:var(--body);font-size:1rem;line-height:1.85;flex:1}
#out.empty{color:var(--muted)}
.remind{font-size:.85rem;color:var(--muted);margin:0;border-top:1px dashed var(--line);padding-top:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mast">
      <h1>群群15號</h1>
      <p class="tagline">新聞寫稿助手：校稿、下標、寫稿、訪綱、新聞改寫、通稿改寫</p>
    </div>
    <div class="conn">
      <label for="backend">後端服務網址（每次使用都要填）</label>
      <div class="row">
        <input id="backend" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="例如：https://your-backend.onrender.com">
        <button class="ghost" id="test" type="button">測試連線</button>
      </div>
      <p class="hint" id="connStatus" role="status">網址只留在這次開啟的頁面，不會儲存，關掉或重新整理就要再填一次。</p>
    </div>
  </header>

  <div class="tabs" role="tablist" id="tabs"></div>

  <main class="desk">
    <section class="pane">
      <h2 id="toolName"></h2>
      <p class="what" id="toolWhat"></p>
      <div class="field" id="extraWrap" hidden>
        <label for="extra" id="extraLabel"></label>
        <input id="extra" type="text" autocomplete="off">
      </div>
      <div class="field">
        <label for="src" id="srcLabel"></label>
        <textarea id="src"></textarea>
      </div>
      <div class="bar">
        <span class="count" id="count">0 字</span>
        <div class="bar">
          <button class="ghost" id="clear" type="button">清空</button>
          <button class="btn" id="go" type="button">開始</button>
        </div>
      </div>
      <p class="status" id="status" role="status"></p>
    </section>

    <section class="pane">
      <div class="bar">
        <h2>成果</h2>
        <button class="ghost" id="copy" type="button">複製成果</button>
      </div>
      <pre id="out" class="empty" tabindex="0">成果會出現在這裡。</pre>
      <p class="remind">發稿前請核對人名、頭銜、時間、地點與數字。標示［可能資訊不足］的地方需要另外查證。</p>
    </section>
  </main>
</div>

<script>
// 各工具的寫作指令放在後端 server.js（WRITE_TOOLS），這裡只留畫面需要的欄位
const TOOLS = [
  {
    "id": "proof",
    "name": "校稿",
    "what": "找出錯別字並修正，原意不變。",
    "srcLabel": "要校對的稿子",
    "ph": "把稿子貼在這裡"
  },
  {
    "id": "title",
    "name": "標題",
    "what": "產生 10 個 ETtoday 風格標題，長短標各 5 個。",
    "srcLabel": "新聞內容",
    "ph": "把新聞稿或重點貼在這裡"
  },
  {
    "id": "write",
    "name": "寫稿",
    "what": "把素材寫成第三人稱新聞稿，附分段標題與新聞標題。",
    "srcLabel": "素材（貼文、逐字稿、筆記）",
    "ph": "把原始素材貼在這裡"
  },
  {
    "id": "interview",
    "name": "訪綱",
    "what": "依藝人近期事件與出席活動，產出剛好 20 題的訪綱。",
    "srcLabel": "近期事件與補充資料",
    "ph": "貼上藝人近期新聞、爭議、新作品、開店等資料。後端若不能上網搜尋，這裡貼得越完整越好。",
    "extraLabel": "藝人名單與出席活動",
    "extraPh": "例：王小明、陳小美／某品牌新品發表會"
  },
  {
    "id": "rewrite",
    "name": "新聞改寫",
    "what": "改寫其他媒體或外電新聞，只抓重點，第二段註明出處，附 10 個標題。",
    "srcLabel": "原新聞全文或連結",
    "ph": "貼上原新聞全文。後端若不能讀取網址，請貼全文不要只貼連結。",
    "extraLabel": "出處媒體",
    "extraPh": "例：三立新聞網、聯合報、Variety"
  },
  {
    "id": "press",
    "name": "通稿改寫",
    "what": "刪掉通稿裡不重要的內容與形容，改成倒金字塔新聞稿並附標題。",
    "srcLabel": "通稿全文",
    "ph": "把公關稿、通稿貼在這裡"
  }
];

const $ = id => document.getElementById(id);
let current = TOOLS[0];
const drafts = {};   // 各工具各自保留輸入，只存在記憶體

function renderTabs(){
  $("tabs").innerHTML = "";
  TOOLS.forEach(t => {
    const b = document.createElement("button");
    b.className = "tab"; b.type = "button"; b.textContent = t.name;
    b.setAttribute("role","tab"); b.setAttribute("aria-selected", t === current);
    b.onclick = () => selectTool(t);
    $("tabs").appendChild(b);
  });
}
function selectTool(t){
  drafts[current.id] = { src:$("src").value, extra:$("extra").value };
  current = t;
  $("toolName").textContent = t.name;
  $("toolWhat").textContent = t.what;
  $("srcLabel").textContent = t.srcLabel;
  $("src").placeholder = t.ph;
  $("extraWrap").hidden = !t.extraLabel;
  if (t.extraLabel){ $("extraLabel").textContent = t.extraLabel; $("extra").placeholder = t.extraPh; }
  const d = drafts[t.id] || {};
  $("src").value = d.src || ""; $("extra").value = d.extra || "";
  $("go").textContent = "開始" + t.name;
  setStatus(""); updateCount(); renderTabs();
}
function updateCount(){ $("count").textContent = $("src").value.replace(/\s/g,"").length + " 字"; }
function setStatus(msg, err){ $("status").textContent = msg; $("status").className = "status" + (err ? " err" : ""); }

// 從各種常見的後端回應格式裡取出文字
function pickText(d){
  if (typeof d === "string") return d;
  if (!d || typeof d !== "object") return "";
  if (Array.isArray(d.content)) { const t = d.content.filter(b => b && b.type === "text").map(b => b.text).join("\n"); if (t) return t; }
  if (d.choices && d.choices[0]) { const c = d.choices[0]; const t = (c.message && c.message.content) || c.text; if (typeof t === "string") return t; }
  if (d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts) return d.candidates[0].content.parts.map(p => p.text || "").join("");
  for (const k of ["text","reply","result","output","answer","response","message","data"]) {
    if (typeof d[k] === "string" && d[k].trim()) return d[k];
    if (d[k] && typeof d[k] === "object") { const t = pickText(d[k]); if (t) return t; }
  }
  return "";
}

const API_PATH = "/api/write";   // 後端收 { tool, prompt }，回 { text }
function baseUrl(){ return $("backend").value.trim().replace(/\/+$/,""); }

async function testConn(){
  const url = baseUrl(), s = $("connStatus");
  if (!/^https?:\/\//i.test(url)) { s.textContent = "請先填入以 https:// 開頭的後端服務網址。"; return; }
  s.textContent = "測試中，後端剛喚醒時可能要等將近一分鐘。";
  try {
    const r = await fetch(url + "/health");
    s.textContent = r.ok ? "連線成功。" : `連線失敗（狀態碼 ${r.status}）。`;
  } catch(e) { s.textContent = "連線失敗，請確認網址正確、後端已啟動。"; }
}

async function run(){
  const url = baseUrl();
  const src = $("src").value.trim();
  const extra = $("extra").value.trim();
  if (!url) { setStatus("請先在最上方填入後端服務網址。", true); $("backend").focus(); return; }
  if (!/^https?:\/\//i.test(url)) { setStatus("後端服務網址要以 https:// 或 http:// 開頭。", true); $("backend").focus(); return; }
  if (!src && !extra) { setStatus("請先貼上內容。", true); $("src").focus(); return; }

  let user = "";
  if (current.extraLabel && extra) user += `${current.extraLabel}：${extra}\n\n`;
  user += `${current.srcLabel}：\n${src || "（未提供）"}`;

  const body = { tool: current.id, prompt: user };
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 180000);
  $("go").disabled = true;
  setStatus(current.name + "處理中，通常需要 10 到 60 秒。");
  try{
    const r = await fetch(url + API_PATH, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body), signal: ctrl.signal });
    const raw = await r.text();
    if (!r.ok) { let m = raw.slice(0,200); try { m = JSON.parse(raw).error || m; } catch(e){} throw new Error(r.status === 404 ? "後端還沒有寫稿功能（找不到 /api/write），請先更新後端的 server.js。" : `後端回應錯誤（${r.status}）：${m}`); }
    let text; try { text = pickText(JSON.parse(raw)); } catch(e) { text = raw; }
    text = (text || "").trim();
    if (!text) throw new Error("後端有回應，但裡面找不到文字內容。請確認後端的回傳格式。");
    $("out").textContent = text; $("out").classList.remove("empty");
    setStatus("完成。");
  }catch(e){
    const msg = e.name === "AbortError" ? "等了 3 分鐘沒有回應，請確認後端服務是否正常後再試一次。"
      : e instanceof TypeError ? "連不上後端服務。請確認網址正確、服務有啟動，而且後端允許這個網頁連線（CORS）。"
      : e.message;
    setStatus(msg, true);
  }finally{
    clearTimeout(timer); $("go").disabled = false;
  }
}

$("go").onclick = run;
$("test").onclick = testConn;
$("src").addEventListener("input", updateCount);
$("clear").onclick = () => { $("src").value = ""; $("extra").value = ""; updateCount(); setStatus(""); $("src").focus(); };
$("copy").onclick = async () => {
  if ($("out").classList.contains("empty")) return;
  const text = $("out").textContent;
  try { await navigator.clipboard.writeText(text); }
  catch(e){ const r = document.createRange(); r.selectNodeContents($("out")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand("copy"); }
  $("copy").textContent = "已複製"; setTimeout(() => $("copy").textContent = "複製成果", 1500);
};

selectTool(TOOLS[0]);
</script>
</body>
</html>
